<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookingWeb Dea</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="container">
        <header class="hero">
            <h1>Booking Futsal System</h1>
            <p>web untuk sistem booking futsalmu</p>
        </header>
        <section class="card">
            <div class="card-header">
                <h4>List Data Booking</h4>
                <div class="card-actions">
                    <button class="btn-primary">Refresh</button>
                    <button class="btn-secondary">+ Booking</button>
                </div>
            </div>
            <table >
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Customer</th>
                        <th>Tanggal</th>
                        <th>Jam Mulai</th>
                        <th>Durasi</th>
                    </tr>
                </thead>
                <tbody id="booking-list"></tbody>
            </table>
        </section>

        <section class="card">
            <div class="card-header">
                <h4>Create Booking</h4>
            </div> 

            <form id="booking-form">
                <label>
                    Pilih Lapangan
                    <select id="lapangan">
                        <option>list lapangan...</option>
                    </select>
                </label>

                <label>
                    Tanggal
                    <input id="tanggal" type="date" required>
                </label>

                <label>
                    Jam Mulai
                    <input id="jam" type="time" min='08:00' max='22:00' required>
                </label>

                <label>
                    Durasi
                    <select id="durasi" required>
                        <option value="1">1 Jam</option>
                        <option value="2">2 Jam</option>
                        <option value="3">3 Jam</option>
                    </select>
                </label>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>


</html>
